spring:
  application:
    name: booking-service
  threads:
    virtual:
      enabled: true
  datasource:
    # Docker Compose MySQL is published on host port 3307. The password must come from the environment.
    url: ${BOOKING_DB_URL:jdbc:mysql://localhost:3307/rb_booking?preserveInstants=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${BOOKING_DB_USER:rb_app}
    password: ${BOOKING_DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only verifies it
  flyway:
    enabled: true

server:
  port: 8082

ridebooking:
  security:
    # Tokens are issued by auth-service. We verify them with its public keys; we never see a private key.
    issuer: ${AUTH_ISSUER:http://localhost:8081}
    jwks-uri: ${AUTH_JWKS_URI:http://localhost:8081/oauth2/jwks}
