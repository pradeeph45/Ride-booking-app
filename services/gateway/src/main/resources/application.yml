spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # Own-API calls are forwarded to auth-service. The /api prefix is stripped.
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**,/api/users/**
              filters:
                - StripPrefix=1

server:
  port: 8080

ridebooking:
  gateway:
    auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    client-id: rb-bff
    client-secret: ${BFF_CLIENT_SECRET}      # required; same value auth-service registered rb-bff with
    cookie-secure: ${COOKIE_SECURE:false}    # set true behind HTTPS
    refresh-cookie-name: rb_refresh
    allowed-origin: ${ALLOWED_ORIGIN:http://localhost:5173}
